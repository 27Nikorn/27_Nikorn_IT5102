name: DevOps CI/CD

on:
  push:
    branches:
      - main
      - staging

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test files
        run: |
          echo "Starting tests..."
          test -f index.html
          test -f style.css
          test -f script.js
          test -f Dockerfile
          echo "All tests passed!"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nikorn-activity-app .